name: Benchmarks

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            go.mod
            benchmarks/comparison/go.sum

      - name: Run package benchmarks
        run: go test -run '^$' -bench=. -benchmem -count=5 ./benchmarks

      - name: Run comparison benchmarks
        working-directory: benchmarks/comparison
        run: go test -run '^$' -bench=. -benchmem -count=5 ./...
