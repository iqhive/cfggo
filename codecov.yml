coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 2%
        base: auto
        flags:
          - unit
        if_ci_failed: warn
    patch:
      default:
        target: 80%
        threshold: 5%
        base: auto
        flags:
          - unit
        if_ci_failed: warn

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

github_checks:
  annotations: true

flags:
  unit:
    paths:
      - .
    carryforward: false
