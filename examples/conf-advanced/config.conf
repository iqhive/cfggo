# Root values are delivered to the group member registered with namespace "".
deployment = production

[api]
port = 8443
timeout = 10s # cfggo converts this string to time.Duration
allowed_origins = ["https://app.example", "https://admin.example"]

[worker]
concurrency = 8
labels = {"queue":"critical","region":"eu-west"}

[global]
# [global] returns to the root from any preceding section.
region = eu-central
